[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aui"
version = "1.0.0"
description = "AOS Unified UI Control System (Playwright, Win32, PyAutoGUI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "PolyForm Noncommercial 1.0.0" }
authors = [
    { name = "Axton Carroll" }
]
keywords = [
    "automation",
    "playwright",
    "win32",
    "opentelemetry",
    "desktop-automation",
    "rpa",
    "agent-operating-system"
]
dependencies = [
    "filelock",
    "uiautomation",
    "playwright",
    "pyautogui",
    "pillow",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
