<!DOCTYPE html>
<html>
<head>
    <title>AUI File Picker Test Page</title>
</head>
<body>
    <h2>Upload File</h2>
    <input type="file" id="file_picker">
    <div id="status">No file uploaded.</div>
    <script>
        document.getElementById('file_picker').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('status').innerText = 'Uploaded: ' + file.name;
            }
        });
    </script>
</body>
</html>
